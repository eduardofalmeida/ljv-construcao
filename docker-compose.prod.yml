# Produção na VPS (Locaweb): Postgres + Backend + Frontend (Nginx)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ljv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ljv_construcao}
      POSTGRES_USER: ${POSTGRES_USER:-ljv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ljv

  backend:
    build: ./backend
    container_name: ljv-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ljv_construcao}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ljv_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://www.ljvconstrucao.com.br,http://ljvconstrucao.com.br,http://177.153.22.65}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_DEV_SEED_DATA: ${APP_DEV_SEED_DATA:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ljv

  frontend:
    build: ./frontend
    container_name: ljv-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - ljv

volumes:
  pgdata:

networks:
  ljv:
    driver: bridge
