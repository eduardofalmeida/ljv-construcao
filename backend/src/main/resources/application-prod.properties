# =====================================================
# Perfil produção (VPS 4GB) — ativar com SPRING_PROFILES_ACTIVE=prod
# =====================================================

spring.main.banner-mode=off
spring.jmx.enabled=false

# Pool pequeno: poucos usuários simultâneos na VPS
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Hibernate mais leve
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Tomcat limitado (2 vCPU)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.max-http-form-post-size=10MB
server.tomcat.connection-timeout=20s

# Actuator só health (público via SecurityConfig)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Sessão: menos sessões = menos memória
server.servlet.session.timeout=${SESSION_TIMEOUT:4h}
