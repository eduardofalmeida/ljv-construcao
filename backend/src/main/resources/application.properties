# =====================================================
# LJV Construção — Configuração da Aplicação
# =====================================================

spring.application.name=ljv-construcao

# --- Banco de Dados ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ljv_construcao
spring.datasource.username=ljv_user
spring.datasource.password=ljv_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Jackson ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- Servidor ---
server.port=8080
server.servlet.context-path=/api

# --- Sessão ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=LJVSESSION
server.servlet.session.cookie.http-only=true

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Seed de dados de desenvolvimento ---
app.dev.seed-data=true
