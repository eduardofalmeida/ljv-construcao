# =====================================================
# LJV Construção — Configuração da Aplicação
# Variáveis podem ser sobrescritas por env no Railway.
# =====================================================

spring.application.name=ljv-construcao

# --- Banco de Dados ---
# Prioridade: SPRING_DATASOURCE_* → variáveis do Postgres (PG* / POSTGRES_*) → padrão local.
# DATABASE_URL do Railway é postgres://... e não serve como JDBC. Monte a URL com PGHOST/PGPORT/PGDATABASE.
# No serviço backend, use Variable Reference: ${{Postgres.PGHOST}}, etc.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:${POSTGRES_DB:ljv_construcao}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${POSTGRES_USER:ljv_user}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:ljv_pass}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool (útil em PaaS)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Jackson ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- Servidor (Railway injeta PORT) ---
server.port=${PORT:8080}
server.servlet.context-path=/api

# --- Sessão ---
# Em produção com frontend em outro domínio: SESSION_COOKIE_SAME_SITE=none e SESSION_COOKIE_SECURE=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=LJVSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- CORS (URL pública do frontend no Railway) ---
# Ex.: APP_CORS_ALLOWED_ORIGINS=https://ljv-frontend.up.railway.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Seed de dados (desligar em produção) ---
app.dev.seed-data=${APP_DEV_SEED_DATA:true}
